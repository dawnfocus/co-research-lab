<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">Co-Research Lab workflow</title>
  <desc id="desc">Human and AI collaborators load minimal context, route tasks through project skills, distill experiments into findings and reports, and export only reviewed open content to a separate public repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="private" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111c4e"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="public" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <marker id="arrowLight" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#93c5fd"/>
    </marker>
    <marker id="arrowCoral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#fb7185"/>
    </marker>
    <marker id="arrowMint" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#14b8a6"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; }
      .lane { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 1.5px; fill: #a5b4fc; }
      .node-title { font: 700 17px Inter, ui-sans-serif, system-ui, sans-serif; fill: #eff6ff; text-anchor: middle; }
      .node-sub { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #bfdbfe; text-anchor: middle; }
      .dark-title { font: 700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0f172a; text-anchor: middle; }
      .dark-sub { font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; fill: #475569; text-anchor: middle; }
      .small { font: 600 14px Inter, ui-sans-serif, system-ui, sans-serif; fill: #cbd5e1; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="940" rx="30" fill="url(#bg)"/>
  <text x="60" y="68" class="title">Human–AI collaborative research, from context to public evidence</text>
  <text x="60" y="101" class="subtitle">Progressive context loading · traceable evidence · explicit publication boundary</text>

  <rect x="36" y="132" width="1300" height="752" rx="34" fill="url(#private)" filter="url(#shadow)"/>
  <text x="70" y="175" class="lane">PRIVATE WORKING REPOSITORY</text>

  <g transform="translate(72 207)">
    <rect width="172" height="98" rx="20" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <circle cx="52" cy="49" r="22" fill="#fb7185"/>
    <path d="M45 49h14M52 42v14" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="116" y="41" class="node-title">Human + AI</text>
    <text x="116" y="64" class="node-sub">shared task</text>
  </g>

  <text x="292" y="205" class="lane">DEFAULT CONTEXT</text>
  <g transform="translate(282 225)">
    <rect width="170" height="72" rx="16" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="85" y="31" class="node-title">AGENTS.md</text>
    <text x="85" y="52" class="node-sub">entry + routing</text>
  </g>
  <g transform="translate(496 225)">
    <rect width="180" height="72" rx="16" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="90" y="31" class="node-title">NOW.md</text>
    <text x="90" y="52" class="node-sub">current focus</text>
  </g>
  <g transform="translate(720 225)">
    <rect width="180" height="72" rx="16" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="90" y="31" class="node-title">INDEX.md</text>
    <text x="90" y="52" class="node-sub">durable map</text>
  </g>
  <g transform="translate(944 225)">
    <rect width="180" height="72" rx="16" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="90" y="31" class="node-title">project.md</text>
    <text x="90" y="52" class="node-sub">stable contract</text>
  </g>
  <g transform="translate(1168 225)">
    <rect width="132" height="72" rx="16" fill="#0f766e" stroke="#5eead4"/>
    <text x="66" y="31" class="node-title">Skill</text>
    <text x="66" y="52" class="node-sub">on demand</text>
  </g>
  <path d="M244 256H272 M452 261H486 M676 261H710 M900 261H934 M1124 261H1158" stroke="#93c5fd" stroke-width="3" marker-end="url(#arrowLight)"/>

  <line x1="70" y1="354" x2="1300" y2="354" stroke="#334a88" stroke-width="2"/>
  <text x="70" y="399" class="lane">EVIDENCE DISTILLATION</text>

  <g transform="translate(72 427)">
    <rect width="146" height="112" rx="20" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <text x="73" y="49" class="node-title">Task</text>
    <text x="73" y="73" class="node-sub">question / code</text>
  </g>
  <g transform="translate(276 427)">
    <rect width="174" height="112" rx="20" fill="#7c2d52" stroke="#fb7185" stroke-width="2"/>
    <text x="87" y="44" class="node-title">Experiment E</text>
    <text x="87" y="68" class="node-sub">protocol + run</text>
    <text x="87" y="88" class="node-sub">failure preserved</text>
  </g>
  <g transform="translate(508 427)">
    <rect width="174" height="112" rx="20" fill="#115e59" stroke="#2dd4bf" stroke-width="2"/>
    <text x="87" y="44" class="node-title">Finding F</text>
    <text x="87" y="68" class="node-sub">scoped claim</text>
    <text x="87" y="88" class="node-sub">limits + counterevidence</text>
  </g>
  <g transform="translate(740 427)">
    <rect width="174" height="112" rx="20" fill="#155e75" stroke="#22d3ee" stroke-width="2"/>
    <text x="87" y="44" class="node-title">Report R</text>
    <text x="87" y="68" class="node-sub">decision-ready</text>
    <text x="87" y="88" class="node-sub">evidence synthesis</text>
  </g>
  <g transform="translate(972 427)">
    <rect width="156" height="112" rx="20" fill="#3730a3" stroke="#a5b4fc" stroke-width="2"/>
    <text x="78" y="44" class="node-title">Paper</text>
    <text x="78" y="68" class="node-sub">claims + story</text>
    <text x="78" y="88" class="node-sub">submission assets</text>
  </g>
  <g transform="translate(1172 427)">
    <path d="M64 0L128 28V70c0 45-27 76-64 92C27 146 0 115 0 70V28Z" transform="translate(0 -24) scale(.72)" fill="#0f766e" stroke="#5eead4" stroke-width="3"/>
    <text x="46" y="72" class="node-title">Review</text>
    <text x="46" y="94" class="node-sub">release gate</text>
  </g>
  <path d="M218 483H266 M450 483H498 M682 483H730 M914 483H962 M1128 483H1162" stroke="#fb7185" stroke-width="3" marker-end="url(#arrowCoral)"/>

  <g transform="translate(160 681)">
    <rect width="230" height="126" rx="22" fill="#0f172a" stroke="#64748b" stroke-dasharray="8 7" stroke-width="2"/>
    <text x="115" y="40" class="node-title">storage/</text>
    <text x="115" y="65" class="node-sub">data · models · runs</text>
    <text x="115" y="91" class="small">ignored by Git</text>
  </g>
  <path d="M330 681C330 626 363 600 363 550" fill="none" stroke="#94a3b8" stroke-width="3" stroke-dasharray="7 7" marker-end="url(#arrowLight)"/>

  <g transform="translate(656 681)">
    <rect width="320" height="126" rx="22" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
    <text x="160" y="40" class="node-title">open/</text>
    <text x="160" y="65" class="node-sub">src · configs · scripts · tests · assets</text>
    <text x="160" y="91" class="small">publishable work product</text>
  </g>
  <path d="M976 744C1120 744 1218 650 1218 550" fill="none" stroke="#2dd4bf" stroke-width="3" marker-end="url(#arrowMint)"/>

  <rect x="1362" y="278" width="200" height="330" rx="30" fill="url(#public)" stroke="#14b8a6" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="1462" cy="375" r="54" fill="#14b8a6"/>
  <path d="M1438 374l17 17 34-38" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1462" y="466" class="dark-title">NEW PUBLIC REPO</text>
  <text x="1462" y="498" class="dark-sub">only reviewed open/</text>
  <text x="1462" y="523" class="dark-sub">no private Git history</text>
  <path d="M1280 483H1345" stroke="#14b8a6" stroke-width="4" marker-end="url(#arrowMint)"/>
  <text x="1462" y="568" class="dark-sub">explicit human approval</text>

  <text x="50" y="917" class="subtitle">Raw outputs become durable knowledge only after they are recorded, scoped, linked, and reviewed.</text>
</svg>
